name: RUNPOD-ALL-DESTROY-0001-EndToEnd

on:
  workflow_dispatch:

concurrency:
  group: runpod-vllm
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Require RUNPOD_API_KEY
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "Add repo secret RUNPOD_API_KEY."
            exit 1
          fi

      - name: Download tfstate from latest apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="${{ github.ref_name }}"
          ALL=$(gh run list --workflow RUNPOD-ALL-SETUP-0001-EndToEnd.yml --branch "$BR" --limit 5 --json databaseId,updatedAt,status)
          STEP=$(gh run list --workflow RUNPOD-0002-Setup.yml --branch "$BR" --status success --limit 1 --json databaseId,updatedAt,status)
          RUN_ID=$(jq -n --argjson a "$ALL" --argjson b "$STEP" '
            ($a + $b) | map(select(.status=="completed")) | max_by(.updatedAt) | .databaseId // empty
          ')
          if [ -z "${RUN_ID}" ]; then
            echo "No successful Setup or ALL-SETUP run on this branch."
            exit 1
          fi
          echo "Using apply run ${RUN_ID}"
          gh run download "${RUN_ID}" -n runpod-tfstate -D terraform/runpod

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/runpod
        run: terraform init -input=false

      - name: Terraform destroy
        working-directory: terraform/runpod
        run: terraform destroy -input=false -auto-approve

      - name: List pods (after)
        run: |
          echo "==> GET /pods (after destroy)"
          curl -sS -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            https://rest.runpod.io/v1/pods \
            | python3 -m json.tool

      - name: Summary
        run: echo "Pod destroyed. GPU bill should be \$0." >> "$GITHUB_STEP_SUMMARY"
