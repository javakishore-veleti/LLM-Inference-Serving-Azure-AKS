name: RUNPOD-0001-CheckPods

on:
  workflow_dispatch:

concurrency:
  group: runpod-vllm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
    steps:
      - name: Require RUNPOD_API_KEY
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "Add repo secret RUNPOD_API_KEY (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - name: List pods
        run: |
          echo "==> GET /pods"
          curl -sS -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            https://rest.runpod.io/v1/pods \
            | python3 -m json.tool
