name: RUNPOD-ALL-SETUP-0001-EndToEnd

on:
  workflow_dispatch:

concurrency:
  group: runpod-vllm
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Require RUNPOD_API_KEY
        run: |
          if [ -z "${RUNPOD_API_KEY}" ]; then
            echo "Add repo secret RUNPOD_API_KEY."
            exit 1
          fi

      - name: List pods (before)
        run: |
          echo "==> GET /pods (before apply)"
          curl -sS -H "Authorization: Bearer ${RUNPOD_API_KEY}" \
            https://rest.runpod.io/v1/pods \
            | python3 -m json.tool

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Terraform init
        working-directory: terraform/runpod
        run: terraform init -input=false

      - name: Terraform apply
        working-directory: terraform/runpod
        run: terraform apply -input=false -auto-approve

      - name: Outputs
        working-directory: terraform/runpod
        run: |
          terraform output
          {
            echo "### Runpod pod"
            echo ""
            echo "- id: \`$(terraform output -raw pod_id)\`"
            echo "- cost/hr: $(terraform output -raw cost_per_hr)"
            echo "- models: $(terraform output -raw models_url)"
            echo ""
            echo "GPU is billing. Tear down with **RUNPOD-ALL-DESTROY-0001-EndToEnd**."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: runpod-tfstate
          path: terraform/runpod/terraform.tfstate
          if-no-files-found: error
          retention-days: 7

      - name: Read pod id
        id: tf
        working-directory: terraform/runpod
        run: echo "pod_id=$(terraform output -raw pod_id)" >> "$GITHUB_OUTPUT"

      - name: curl /v1/models and /v1/completions
        env:
          POD_ID: ${{ steps.tf.outputs.pod_id }}
        run: |
          chmod +x scripts/runpod-verify.sh
          ./scripts/runpod-verify.sh
