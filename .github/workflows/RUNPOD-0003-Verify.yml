name: RUNPOD-0003-Verify

on:
  workflow_dispatch:

concurrency:
  group: runpod-vllm
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Download tfstate from latest apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BR="${{ github.ref_name }}"
          ALL=$(gh run list --workflow RUNPOD-ALL-SETUP-0001-EndToEnd.yml --branch "$BR" --limit 5 --json databaseId,updatedAt,status)
          STEP=$(gh run list --workflow RUNPOD-0002-Setup.yml --branch "$BR" --status success --limit 1 --json databaseId,updatedAt,status)
          RUN_ID=$(jq -n --argjson a "$ALL" --argjson b "$STEP" '
            ($a + $b) | map(select(.status=="completed")) | max_by(.updatedAt) | .databaseId // empty
          ')
          if [ -z "${RUN_ID}" ]; then
            echo "No successful Setup or ALL-SETUP run on this branch."
            exit 1
          fi
          echo "Using apply run ${RUN_ID}"
          gh run download "${RUN_ID}" -n runpod-tfstate -D terraform/runpod


      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.3"
          terraform_wrapper: false

      - name: Read pod id from state
        id: tf
        working-directory: terraform/runpod
        run: |
          terraform init -input=false
          echo "pod_id=$(terraform output -raw pod_id)" >> "$GITHUB_OUTPUT"

      - name: curl /v1/models and /v1/completions
        env:
          POD_ID: ${{ steps.tf.outputs.pod_id }}
        run: |
          chmod +x scripts/runpod-verify.sh
          ./scripts/runpod-verify.sh
